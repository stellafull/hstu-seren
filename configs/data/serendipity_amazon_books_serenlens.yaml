_target_: generative_recommenders_pl.data.reco_dataset.RecoDataModule
dataset_name: serendipity-books-serenlens
batch_size: 16
max_sequence_length: 200
chronological: true
positional_sampling_ratio: 1.0

data_preprocessor:
  _target_: generative_recommenders_pl.data.preprocessor.SerendipityAmazonDataProcessor
  domain: books
  subset: serenlens
  min_sequence_length: 1

train_dataset:
  _target_: generative_recommenders_pl.data.reco_dataset.RecoDataset
  ignore_last_n: 1

val_dataset:
  _target_: generative_recommenders_pl.data.reco_dataset.RecoDataset
  ignore_last_n: 0

test_dataset:
  _target_: generative_recommenders_pl.data.reco_dataset.RecoDataset
  ignore_last_n: 0
