# @package data
# pre-train dataset for serendipity-2018 (5-core variant)

_target_: generative_recommenders_pl.data.reco_dataset.RecoDataModule
dataset_name: serendipity-2018
semantic_id_prefix: serendipity_2018
data_preprocessor:
  _target_: generative_recommenders_pl.data.preprocessor.MovielensDataProcessor
  ratings_path: ${paths.root_dir}/tmp/serendipity-2018/serendipity-sac2018/training.csv
  movies_path: ${paths.root_dir}/tmp/serendipity-2018/serendipity-sac2018/movies.csv
  prefix: serendipity-2018
  output_root: ${paths.root_dir}/tmp/pre_train
  min_sequence_length: 5
  min_presence: 5
train_dataset:
  _target_: generative_recommenders_pl.data.reco_dataset.RecoDataset
  ignore_last_n: 1
  shift_id_by: 1
val_dataset:
  _target_: generative_recommenders_pl.data.reco_dataset.RecoDataset
  ignore_last_n: 0
  shift_id_by: 1
test_dataset:
  _target_: generative_recommenders_pl.data.reco_dataset.RecoDataset
  ignore_last_n: 0
  shift_id_by: 1
max_sequence_length: 200
chronological: true
positional_sampling_ratio: 1.0
batch_size: 128
num_workers: 8
prefetch_factor: 2
