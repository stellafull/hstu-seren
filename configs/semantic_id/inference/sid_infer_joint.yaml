# @package _global_

defaults:
  - /hydra: default
  - /paths: default
  - _self_

task_name: semantic_id_infer

infer_cfg: null

inference:
  embeddings:
    - path: ${paths.root_dir}/tmp/semantic_id/serendipity_2018/embeddings.parquet
      dtype: float16
      id_prefix: "seren::"
    - path_glob: ${paths.root_dir}/tmp/semantic_id/amazon_books/embeddings_part*.parquet
      dtype: float16
      id_prefix: "amzn_books::"
    - path_glob: ${paths.root_dir}/tmp/semantic_id/amazon_movies/embeddings_part*.parquet
      dtype: float16
      id_prefix: "amzn_movies::"
  quantizer_path: ${paths.root_dir}/tmp/semantic_id/joint/quantizer.pt
  output_path: ${paths.root_dir}/tmp/semantic_id/joint/inference_semantic_ids.pt
  normalize_residuals: null
  device: null
  chunk_size: 65536
  dedup_slot_cardinality: 512
  storage_dtype: null
  compute_dtype: null
  overwrite: false
