# @package _global_

defaults:
  - /hydra: default
  - /paths: default
  - _self_

task_name: semantic_id_train

train_cfg: null

training:
  embeddings:
    - path: ${paths.root_dir}/tmp/semantic_id/serendipity_2018/embeddings.parquet
      dtype: float16
      id_prefix: "seren::"
    - path_glob: ${paths.root_dir}/tmp/semantic_id/amazon_books/embeddings_part*.parquet
      dtype: float16
      id_prefix: "amzn_books::"
    - path_glob: ${paths.root_dir}/tmp/semantic_id/amazon_movies/embeddings_part*.parquet
      dtype: float16
      id_prefix: "amzn_movies::"
  output:
    quantizer_path: ${paths.root_dir}/tmp/semantic_id/joint/quantizer.pt
    semantic_ids_path: ${paths.root_dir}/tmp/semantic_id/joint/semantic_ids.pt
    overwrite: false
  quantizer:
    num_hierarchies: 4
    codebook_width: 512
    chunk_size: 65536
    max_iterations: 20
    tolerance: 1e-4
    normalize_residuals: true
    device: null
    use_mini_batch: true
    mini_batch_size: 65536
    shuffle_mini_batches: true
    storage_dtype: float16
    compute_dtype: float32
  seed: 42
