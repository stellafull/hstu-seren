_target_: generative_recommenders_pl.models.ser_retrieval.SerRetrieval

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3e-4
  betas: [0.9, 0.98]
  weight_decay: 0.01

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: max
  factor: 0.5
  patience: 8
  threshold: 1e-4

configure_optimizer_params:
  monitor: val/ndcg@100
  interval: epoch
  frequency: 1

gr_output_length: 10
item_embedding_dim: 256

embeddings:
  _target_: generative_recommenders_pl.models.embeddings.embeddings.LocalEmbeddingModule
  num_items: ${data.data_preprocessor.expected_num_unique_items}
  item_embedding_dim: ${model.item_embedding_dim}

preprocessor:
  _target_: generative_recommenders_pl.models.preprocessors.LearnablePositionalEmbeddingInputFeaturesPreprocessor
  max_sequence_len: ${eval:${data.max_sequence_length} + ${model.gr_output_length} + 1}
  embedding_dim: ${model.item_embedding_dim}
  dropout_rate: 0.2

sequence_encoder:
  _target_: generative_recommenders_pl.models.sequential_encoders.hstu.HSTU
  max_sequence_len: ${data.max_sequence_length}
  max_output_len: ${eval:${model.gr_output_length} + 1}
  embedding_dim: ${model.item_embedding_dim}
  item_embedding_dim: ${model.item_embedding_dim}
  num_blocks: 2
  num_heads: 1
  attention_dim: ${model.item_embedding_dim}
  linear_dim: ${model.item_embedding_dim}
  linear_dropout_rate: 0.2
  attn_dropout_rate: 0.0
  normalization: rel_bias
  linear_config: uvqk
  linear_activation: silu
  concat_ua: false
  enable_relative_attention_bias: true

postprocessor:
  _target_: generative_recommenders_pl.models.postprocessors.postprocessors.L2NormEmbeddingPostprocessor
  embedding_dim: ${model.item_embedding_dim}
  eps: 1e-6

similarity:
  _target_: generative_recommenders_pl.models.similarity.dot_product.DotProductSimilarity

negatives_sampler:
  _target_: generative_recommenders_pl.models.negatives_samples.negative_sampler.LocalNegativesSampler
  l2_norm: true
  l2_norm_eps: 1e-6

candidate_index:
  _target_: generative_recommenders_pl.models.indexing.candidate_index.CandidateIndex
  k: 200
  top_k_module:
    _target_: generative_recommenders_pl.models.indexing.top_k.MIPSBruteForceTopK

candidate_builder:
  _target_: generative_recommenders_pl.models.postprocessors.ser_postprocessors.CandidateSetBuilder
  candidate_size: 200
  ensure_target: true
  pad_id: 0

loss:
  _target_: generative_recommenders_pl.models.losses.soft_ndcg_ser.SoftNDCGSerLoss
  k: 10
  beta: 0.05
  soft_rank_strength: 0.5
  cutoff_temperature: 1.0

ser_metrics:
  _target_: generative_recommenders_pl.models.metrics.ser_metrics.SerMetrics
  at_k_list: [5, 10, 20]
  condition_on_positive: false

metrics:
  _target_: generative_recommenders_pl.models.metrics.retrieval.RetrievalMetrics
  k: ${model.candidate_index.k}
  at_k_list: [10, 50, 100, 200]

ser_energy:
  _target_: generative_recommenders_pl.models.ser_energy.SerEnergy
  d_in: ${eval:${model.item_embedding_dim} + 4}
  d_hidden: 256
  num_layers: 2
  dropout: 0.1
  activation: gelu

use_ser_energy: true
lambda_ser: 0.4
detach_base_steps: 10000
ser_label_source: hybrid
eval_ser_label_source: null
unexpectedness_quantile: 0.65
relevance_gate_quantile: null

# compile model for faster training with pytorch 2.0
compile_model: false
