_target_: generative_recommenders_pl.models.sas_rec_seren.SASRecSeren

optimizer:
  _target_: torch.optim.SGD
  _partial_: true

scheduler:
  _target_: torch.optim.lr_scheduler.ConstantLR
  _partial_: true

configure_optimizer_params:
  monitor: val/hr@100
  interval: epoch
  frequency: 1

gr_output_length: 10
item_embedding_dim: 50
embedding_type: local
semantic_id_prefix: ${oc.select:data.semantic_id_prefix,${data.data_preprocessor.prefix}}

embedding_configs:
  local:
    _target_: generative_recommenders_pl.models.embeddings.embeddings.LocalEmbeddingModule
    item_embedding_dim: ${model.item_embedding_dim}
  semantic_id:
    _target_: generative_recommenders_pl.models.embeddings.embeddings_sid.LocalSIDEmbeddingModule
    item_embedding_dim: ${model.item_embedding_dim}
    semantic_id_path: ${paths.root_dir}/tmp/semantic_id/${model.semantic_id_prefix}/semantic_ids.pt
    quantizer_path: ${paths.root_dir}/tmp/semantic_id/${model.semantic_id_prefix}/quantizer.pt
    emb_method: RQsum-indEmb
    emb_comb_method: sum
    scale_sid_emb: true
    used_uniq_layer: false
    use_num_codebook_layers: 0
    missing_item_strategy: fallback_to_individual
    apply_checkpoint: false

embeddings: ${model.embedding_configs.${model.embedding_type}}

preprocessor:
  _target_: generative_recommenders_pl.models.preprocessors.LearnablePositionalEmbeddingInputFeaturesPreprocessor
  max_sequence_len: ${eval:${data.max_sequence_length} + ${model.gr_output_length} + 1}
  embedding_dim: ${model.item_embedding_dim}
  dropout_rate: 0.2

sequence_encoder:
  _target_: generative_recommenders_pl.models.sequential_encoders.sasrec.SASRec
  max_sequence_len: ${data.max_sequence_length}
  max_output_len: ${eval:${model.gr_output_length} + 1}
  embedding_dim: ${model.item_embedding_dim}
  item_embedding_dim: ${model.item_embedding_dim}
  num_blocks: 4
  num_heads: 2
  ffn_hidden_dim: ${eval:4 * ${model.item_embedding_dim}}
  ffn_activation_fn: gelu
  ffn_dropout_rate: 0.1
  activation_checkpoint: false

postprocessor:
  _target_: generative_recommenders_pl.models.postprocessors.postprocessors.L2NormEmbeddingPostprocessor
  embedding_dim: ${model.item_embedding_dim}
  eps: 1e-6

similarity:
  _target_: generative_recommenders_pl.models.similarity.dot_product.DotProductSimilarity

negatives_sampler:
  _target_: generative_recommenders_pl.models.negatives_samples.negative_sampler.LocalNegativesSampler
  l2_norm: true
  l2_norm_eps: 1e-6

candidate_index:
  _target_: generative_recommenders_pl.models.indexing.candidate_index.CandidateIndex
  k: 200
  top_k_module:
    _target_: generative_recommenders_pl.models.indexing.top_k.MIPSBruteForceTopK

loss:
  _target_: generative_recommenders_pl.models.losses.autoregressive_losses.SampledSoftmaxLoss
  num_to_sample: 128
  softmax_temperature: 0.05

metrics:
  _target_: generative_recommenders_pl.models.metrics.retrieval.RetrievalMetrics
  k: ${model.candidate_index.k}
  at_k_list: [10, 50, 100, 200]

ser_metrics:
  _target_: generative_recommenders_pl.models.metrics.ser_retrival.SerendipityRetrievalMetrics
  k: ${model.candidate_index.k}
  at_k_list: [5, 10, 50, 100, 200]

seren_expert:
  _target_: generative_recommenders_pl.models.heads.seren_expert.SerendipityExpertHead
  user_dim: ${model.item_embedding_dim}
  item_dim: ${model.item_embedding_dim}
  hidden_dims: [256, 128]
  dropout: 0.1

seren_loss:
  _target_: generative_recommenders_pl.models.losses.ser_losses.SerendipityBCELoss
  reduction: mean

seren_loss_weight: 0.2
seren_score_alpha: 1.0

transfer_learning:
  enabled: false
  checkpoint_path: null
  strict: false
  freeze_backbone: false
  freeze_modules: []
  unfreeze_modules: []

pretrained_checkpoint_path: null
load_strict: false

# compile model for faster training with pytorch 2.0
compile_model: false
