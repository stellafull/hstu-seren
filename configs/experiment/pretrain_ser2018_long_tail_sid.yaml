# @package _global_

# Run pre-training on the Serendipity 2018 long-tail split using the semantic ID encoder.

defaults:
  - override /data: serendipity_2018_training_long_tail
  - override /model: hstu_seren
  - override /callbacks: default
  - override /logger: many_loggers
  - override /trainer: default
  - _self_

seed: 42

data:
  batch_size: 128
  num_workers: 8
  max_sequence_length: 200

tags: ["ser2018", "pretrain", "long_tail", "sid"]

trainer:
  min_epochs: 20
  max_epochs: 100

model:
  embedding_type: semantic_id  # semantic ID embedding variant
  embedding_configs:
    semantic_id:
      emb_comb_method: projgate
  ser_metrics: null
  seren_loss_weight: 0.0
  seren_score_alpha: 0.0

  transfer_learning:
    enabled: false

  pretrained_checkpoint_path: null
  load_strict: false
  item_embedding_dim: 256

  sequence_encoder:
    num_blocks: 8
    num_heads: 4

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    betas: [0.9, 0.98]
    weight_decay: 0.001

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    factor: 0.1
    patience: 10
    threshold: 1e-4

  configure_optimizer_params:
    monitor: val/ndcg@100
    interval: epoch
    frequency: 1

  loss:
    num_to_sample: 128

  compile_model: true

callbacks:
  model_checkpoint:
    dirpath: ${paths.root_dir}/tmp/checkpoints/pretrain_ser2018_long_tail_sid
    filename: "epoch_{epoch:03d}"
    save_last: true
    save_top_k: 0

logger:
  tensorboard:
    name: ser2018_pretrain_long_tail
    version: 0
  csv:
    name: ser2018_pretrain_long_tail
