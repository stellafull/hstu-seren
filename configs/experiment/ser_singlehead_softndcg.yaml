# @package _global_

defaults:
  - override /model: ser_hstu

seed: 42

trainer:
  min_epochs: 5
  max_epochs: 80

model:
  configure_optimizer_params:
    monitor: val/ndcg_ser@10
  lambda_ser: 0.4
  unexpectedness_quantile: 0.65
  relevance_gate_quantile: 0.6
  loss:
    k: 10
    beta: 0.05
    soft_rank_strength: 0.5

callbacks:
  model_checkpoint:
    monitor: val/ndcg_ser@10
    mode: max
