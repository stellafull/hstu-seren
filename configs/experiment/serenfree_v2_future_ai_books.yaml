# @package _global_

defaults:
  - serenfree_v2_r_pretrain_books
  - _self_

tags: ["serenfree_v2", "books", "rai_policy", "label_free"]

model:
  decoder_modes: null
  lambda_i: 0.2
  lambda_a: 0.2
  training_objective: next_transition_policy
  next_transition_loss_positions: last
  future_target_loss: legacy_history_proxy
  require_future_targets: false
  detach_aux_context: true

callbacks:
  model_checkpoint:
    monitor: val/ndcg@100
    mode: max
    save_top_k: 1
    save_last: true
  early_stopping:
    monitor: val/ndcg@100
    mode: max
    patience: 10

rai_policy:
  semantic_cols_only_for_i_a: true
  full_sid_cols_for_r: true
  recent_window_size: 10
  aig_promote_only: true
  rating_positive_threshold: 4.0

test: false

data:
  train_dataset:
    _target_: generative_recommenders_pl.data.reco_dataset.LOOManifestTrainDataset
    ratings_file: ${paths.root_dir}/tmp/loo_manifest/books/loo_v1/loo_train.parquet
    shift_id_by: 1
  val_dataset:
    _target_: generative_recommenders_pl.data.reco_dataset.LOOManifestEvalDataset
    ratings_file: ${paths.root_dir}/tmp/loo_manifest/books/loo_v1/loo_eval.parquet
    shift_id_by: 1
serenfree_v2:
  decoder_modes: ["R", "I", "A"]
  train_dedup_for_R: true
  train_dedup_for_I: false
  train_dedup_for_A: false
