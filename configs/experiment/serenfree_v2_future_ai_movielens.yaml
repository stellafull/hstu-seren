# @package _global_

defaults:
  - serenfree_v2_r_pretrain_movielens
  - _self_

tags: ["serenfree_v2", "movielens", "future_ai", "label_free"]

model:
  decoder_modes: null
  lambda_i: 0.2
  lambda_a: 0.2
  future_target_loss: trie_marginal
  require_future_targets: true

future_targets:
  imminent_window: 3
  acceptable_min_gap: 4
  acceptable_window: 50
  rating_positive_threshold: 4.0
  max_i_targets: 3
  max_a_targets: 32
  exclude_seen: true
  cap_policy_A: rating_then_recency
  cap_policy_I: earliest
  target_loss: trie_marginal


test: false

data:
  train_dataset:
    _target_: generative_recommenders_pl.data.reco_dataset.FutureWindowTargetDataset
    ratings_file: ${paths.root_dir}/tmp/future_targets/movielens/loo_v1/future_targets.parquet
    max_i_targets: ${future_targets.max_i_targets}
    max_a_targets: ${future_targets.max_a_targets}
    emit_rank_from_future_targets: false
serenfree_v2:
  decoder_modes: ["R", "I", "A"]
  train_dedup_for_R: true
  train_dedup_for_I: false
  train_dedup_for_A: false
