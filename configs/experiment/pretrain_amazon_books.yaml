# @package _global_

defaults:
  - override /data: amazon_books
  - override /model: hstu_seren

seed: 42

tags: ["pretrain", "amazon", "books"]

trainer:
  max_epochs: 100
  limit_val_batches: 1.0
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  enable_checkpointing: true

model:
  loss_weights:
    rel: 1.0
    ser: 0.0
  pos_weight: 1.0
  metrics:
    ranking:
      ks: [5, 10, 20, 50, 100]
    serendipity:
      ks: [5, 10, 20]

callbacks:
  model_checkpoint:
    dirpath: ${paths.root_dir}/tmp/checkpoints/pretrain_amazon_books
    filename: "stage_a-{epoch:03d}"
    save_top_k: 0
    save_last: true
    auto_insert_metric_name: false
