# @package _global_

# SASRec with focal serendipity supervision on the SerenLens movies long-tail split.

defaults:
  - override /data: serenlens_movies_long_tail
  - override /model: sas_rec_seren
  - override /callbacks: default
  - override /logger: many_loggers
  - override /trainer: default
  - _self_

seed: 42

data:
  batch_size: 256
  num_workers: 48
  max_sequence_length: 200

tags: ["serenlens_movies", "long_tail", "sasrec", "seren_focal"]

trainer:
  min_epochs: 99
  max_epochs: 100

model:
  embedding_type: semantic_id
  seren_loss_weight: 0.5
  seren_score_alpha: 1.0

  seren_loss:
    _target_: generative_recommenders_pl.models.losses.ser_losses.SerendipityFocalLoss
    reduction: mean
    gamma: 2.0
    alpha: 0.25

  load_strict: false
  item_embedding_dim: 256

  sequence_encoder:
    num_blocks: 8
    num_heads: 4
    ffn_hidden_dim: 1024
    ffn_dropout_rate: 0.2

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    betas: [0.9, 0.98]
    weight_decay: 0.0001

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    factor: 0.1
    patience: 10
    threshold: 1e-4

  configure_optimizer_params:
    monitor: val/ndcg_ser@100
    interval: epoch
    frequency: 1

  loss:
    softmax_temperature: 0.1

  compile_model: true

callbacks:
  model_checkpoint:
    dirpath: ${paths.root_dir}/tmp/checkpoints/serenlens_movies_long_tail_sasrec_seren_focal
    filename: "epoch_{epoch:03d}"
    save_last: true
    save_top_k: 0

logger:
  tensorboard:
    name: serenlens_movies_long_tail_sasrec_seren_focal
    version: null
  csv:
    name: serenlens_movies_long_tail_sasrec_seren_focal
