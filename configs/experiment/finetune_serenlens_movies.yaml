# @package _global_

defaults:
  - override /data: serenlens_movies
  - override /model: hstu_seren

seed: 42

tags: ["finetune", "serenlens", "movies"]

trainer:
  max_epochs: 100
  log_every_n_steps: 25
  enable_checkpointing: true

model:
  init_from_ckpt: ${paths.root_dir}/tmp/checkpoints/pretrain_amazon_movies/last.ckpt
  freeze_base_epochs: 2
  loss_weights:
    rel: 0.5
    ser: 1.0
  pos_weight: 25.0
  metrics:
    ranking:
      ks: [5, 10, 20, 50, 100]
    serendipity:
      ks: [5, 10, 20]

callbacks:
  model_checkpoint:
    dirpath: ${paths.root_dir}/tmp/checkpoints/finetune_serenlens_movies
    filename: "stage_b-{epoch:03d}"
    save_top_k: 1
    save_last: true
    monitor: val/ndcg@10
    mode: max
    auto_insert_metric_name: false
