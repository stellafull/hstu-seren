# @package _global_

# Run pre-training on the Amazon Books long-tail split with the baseline embedding setup.

defaults:
  - override /data: amazon_books_long_tail
  - override /model: hstu_seren
  - override /callbacks: default
  - override /logger: many_loggers
  - override /trainer: default
  - _self_

seed: 42

data:
  batch_size: 128
  num_workers: 4
  max_sequence_length: 50

tags: ["ama_bk", "pretrain", "long_tail"]

trainer:
  min_epochs: 20
  max_epochs: 100

model:
  embedding_type: local  # set to "semantic_id" for SID ablations
  ser_metrics: null
  seren_loss_weight: 0.0
  seren_score_alpha: 0.0

  transfer_learning:
    enabled: false

  pretrained_checkpoint_path: null
  load_strict: false
  item_embedding_dim: 256

  sequence_encoder:
    num_blocks: 4
    num_heads: 2

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    betas: [0.9, 0.98]
    weight_decay: 0.001

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    factor: 0.1
    patience: 10
    threshold: 1e-4

  configure_optimizer_params:
    monitor: val/ndcg@100
    interval: epoch
    frequency: 1

  loss:
    num_to_sample: 512

  compile_model: true

callbacks:
  model_checkpoint:
    dirpath: ${paths.root_dir}/tmp/checkpoints/amazon_books_long_tail
    filename: "epoch_{epoch:03d}"
    save_last: true
    save_top_k: 0

logger:
  tensorboard:
    name: ama_book_pretrain_long_tail
    version: null
  csv:
    name: ama_book_pretrain_long_tail
