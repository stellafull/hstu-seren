# @package _global_

# Fine-tune on the SerenLens books long-tail split with semantic ID embeddings.

defaults:
  - override /data: serenlens_books_long_tail
  - override /model: hstu_seren
  - override /callbacks: default
  - override /logger: many_loggers
  - override /trainer: default
  - _self_

seed: 42

data:
  batch_size: 256
  num_workers: 48
  max_sequence_length: 50

tags: ["serenlens_books", "finetune", "long_tail", "sid"]

trainer:
  min_epochs: 99
  max_epochs: 100

model:
  embedding_type: semantic_id
  embedding_configs:
    semantic_id:
      emb_comb_method: projgate

  seren_loss_weight: 0.5
  seren_score_alpha: 1
  seren_loss:
    _target_: generative_recommenders_pl.models.losses.ser_losses.SerendipityFocalLoss
    reduction: mean
    gamma: 2.0
    alpha: 0.25
    pos_weight: 20

  transfer_learning:
    enabled: true
    checkpoint_path: ${paths.root_dir}/tmp/checkpoints/amazon_books_long_tail_sid/last.ckpt
    strict: false
    freeze_backbone: false
    freeze_modules: []
    unfreeze_modules: []
  load_strict: false
  item_embedding_dim: 256

  sequence_encoder:
    num_blocks: 4
    num_heads: 2

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001
    betas: [0.9, 0.98]
    weight_decay: 0.00001

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    factor: 0.1
    patience: 5
    threshold: 1e-4

  configure_optimizer_params:
    monitor: val/ndcg_ser@100
    interval: epoch
    frequency: 1

  compile_model: true

callbacks:
  model_checkpoint:
    dirpath: ${paths.root_dir}/tmp/checkpoints/finetune_serenlens_books_long_tail_sid
    filename: "epoch_{epoch:03d}"
    save_last: true
    save_top_k: 0

logger:
  tensorboard:
    name: serenlens_books_long_tail_finetune_sid
    version: null
  csv:
    name: serenlens_books_long_tail_finetune_sid
