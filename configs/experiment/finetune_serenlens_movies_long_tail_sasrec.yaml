# @package _global_

# Fine-tune SASRec on the SerenLens movies long-tail split without serendipity supervision.

defaults:
  - override /data: serenlens_movies_long_tail
  - override /model: sas_rec_seren
  - override /callbacks: default
  - override /logger: many_loggers
  - override /trainer: default
  - _self_

seed: 42

data:
  batch_size: 256
  num_workers: 48
  max_sequence_length: 50

tags: ["serenlens_movies", "finetune", "long_tail", "sasrec"]

trainer:
  min_epochs: 10
  max_epochs: 100

model:
  embedding_type: local
  ser_metrics: null
  seren_loss_weight: 0.0
  seren_score_alpha: 0.0

  transfer_learning:
    enabled: true
    checkpoint_path: ${paths.root_dir}/tmp/checkpoints/amazon_movies_long_tail_sasrec/last.ckpt
    strict: false
    freeze_backbone: false
    freeze_modules: []
    unfreeze_modules: []

  load_strict: false
  item_embedding_dim: 256

  sequence_encoder:
    num_blocks: 4
    num_heads: 2
    ffn_dropout_rate: 0.1

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001
    betas: [0.9, 0.98]
    weight_decay: 0.00001

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: max
    factor: 0.1
    patience: 5
    threshold: 1e-4

  configure_optimizer_params:
    monitor: val/ndcg@100
    interval: epoch
    frequency: 1

  loss:
    softmax_temperature: 0.1

  compile_model: true

callbacks:
  model_checkpoint:
    dirpath: ${paths.root_dir}/tmp/checkpoints/finetune_serenlens_movies_long_tail_sasrec
    filename: "epoch_{epoch:03d}"
    save_last: true
    save_top_k: 0

logger:
  tensorboard:
    name: serenlens_movies_long_tail_finetune_sasrec
    version: null
  csv:
    name: serenlens_movies_long_tail_finetune_sasrec
